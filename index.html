<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaktinde</title>
<style>
  :root { --ground:#F6F2EA; --card:#FFFDF9; --border:#E4DDD0;
          --ink:#10242F; --muted:#5B6870; --accent:#0D5471; }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#04202C; --card:#0B3040; --border:#17475B;
            --ink:#F2ECE0; --muted:#93A6B0; --accent:#57ADD1; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:72px 16px 96px; background:var(--ground); color:var(--ink);
         font:17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:34rem; margin:0 auto; }
  h1 { font-size:34px; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 36px; }
  a.row { display:block; background:var(--card); border:1px solid var(--border);
          border-radius:14px; padding:18px 20px; margin-bottom:12px;
          text-decoration:none; color:var(--ink); }
  a.row strong { display:block; color:var(--accent); }
  a.row span { color:var(--muted); font-size:15px; }
  footer { margin-top:40px; color:var(--muted); font-size:15px; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Vaktinde</h1>
  <p class="sub">Namaz vakitleri, kıble, Kur'an, zikir ve hadis — iPhone için</p>

  <a class="row" href="destek.html">
    <strong>Destek</strong>
    <span>Sık sorulanlar ve iletişim</span>
  </a>
  <a class="row" href="gizlilik.html">
    <strong>Gizlilik Politikası</strong>
    <span>Uygulama hiçbir kişisel veri toplamaz</span>
  </a>

  <footer><a href="mailto:cnrmus@gmail.com">cnrmus@gmail.com</a></footer>
</main>
</body>
</html>
